[build-system]
requires = [
    "hatchling",
    "hatch-cython>=0.5.0",
    "cython>=3.2.4,<4.0",
]
build-backend = "hatchling.build"

[project]
name = "cefpython3"
version = "123.0b4"
description = "Python bindings for the Chromium Embedded Framework (CEF)"
readme = "DISTRIBUTION_README.md"
license = {file = "License"}
authors = [
    {name = "Czarek Tomczak", email = "czarek.tomczak@gmail.com"},
]
maintainers = [
    {name = "CEF Python Contributors"},
]
keywords = [
    "chromium",
    "cef",
    "browser",
    "embedded",
    "webkit",
    "gui",
    "web",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Cython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pillow>=9.0",
]
examples = [
    "pillow>=9.0",  # For screenshot example
]

[project.urls]
Homepage = "https://github.com/cztomczak/cefpython"
Documentation = "https://github.com/cztomczak/cefpython/blob/master/docs/README.md"
Repository = "https://github.com/cztomczak/cefpython"
Issues = "https://github.com/cztomczak/cefpython/issues"
Changelog = "https://github.com/cztomczak/cefpython/blob/master/CHANGELOG.md"

# Version is statically defined in [project] section above

# Enable custom build hook for platform-aware building
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# Platform-specific package paths - will be set dynamically
# Linux: build/cefpython3_123.0_linux64/cefpython3
# Windows: build/cefpython3_123.0_win64/cefpython3
# Mac: build/cefpython3_123.0_mac64/cefpython3
packages = []  # Set dynamically by build hook

# Include all binary files (platform-agnostic patterns)
include = [
    "cefpython3/*.so",      # Linux
    "cefpython3/*.pyd",     # Windows
    "cefpython3/*.dll",     # Windows
    "cefpython3/*.exe",     # Windows
    "cefpython3/*.lib",     # Windows
    "cefpython3/*.dylib",   # Mac
    "cefpython3/subprocess",
    "cefpython3/libcef.so",
    "cefpython3/lib*.so*",
    "cefpython3/*.pak",
    "cefpython3/*.bin",
    "cefpython3/*.dat",
    "cefpython3/*.json",
    "cefpython3/locales/*.pak",
    "cefpython3/chrome-sandbox",
    "cefpython3/examples/**/*",
    "cefpython3/*.txt",
    "cefpython3/License",
    "cefpython3/LICENSE.txt",
    "cefpython3/README.txt",
]

# Platform-specific force-include will be set by build hook
# This section is kept for reference but overridden at build time
[tool.hatch.build.targets.wheel.force-include]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tools",
    "/examples",
    "/License",
    "/README.md",
    "/CHANGELOG.md",
    "/CEF123_LINUX_UPGRADE.md",
    "/DISTRIBUTION_README.md",
    "/pyproject.toml",
    "/hatch_build.py",
]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0",
    "pillow>=9.0",
]

[tool.hatch.envs.default.scripts]
# Build C++ libraries and Cython extension
build-cpp = "python tools/build.py 123.0 --fast"

# Run examples
example-hello = "python -c 'from cefpython3.examples import hello_world; hello_world.main()'"
# Clean build artifacts (minimal)
clean = "rm -rf build/build_cefpython build/temp.* dist/ *.egg-info && find . -type d -name __pycache__ -delete 2>/dev/null ; find . -type f -name '*.pyc' -delete ; find . -type f -name '*.pyo' -delete"
# Clean all build artifacts for full rebuild (keeps downloaded CEF binaries in build/cef*)
clean-build = "rm -rf build/build_cefpython build/cefpython_binary_* build/cefpython3_* build/temp.* build/lib.* dist/ *.egg-info src/client_handler/*.o src/client_handler/*.a src/subprocess/*.o src/subprocess/*.a src/cpp_utils/*.o src/cpp_utils/*.a && find . -type d -name __pycache__ -delete 2>/dev/null ; find . -type f -name '*.pyc' -delete ; find . -type f -name '*.pyo' -delete"

[tool.hatch.envs.build]
description = "Environment for building the complete package"
detached = true
dependencies = [
    "hatchling",
    "hatch-cython>=0.5.0",
    "cython>=3.2.4,<4.0",
    "pillow>=9.0",
    "setuptools>=65.0",
    "build>=1.0",
]

[tool.hatch.envs.build.scripts]
# Complete build process - calls orchestration script
all = "python tools/build_all.py"
# Individual steps (can be run separately)
setup-cef = "python tools/setup_cef.py"
setup-cef-windows = "python tools/setup_cef.py"
build-libs = "python tools/build_libs_only.py 123.0 --fast"
build-libs-with-tests = "python tools/build.py 123.0 --fast"
build-wheel = "hatch build --target wheel"
checksums = "python tools/generate_checksums.py"
# Prepare multi-version build environments
prepare-envs = "python tools/prepare_build_envs.py"

# Multi-version build environment with Python version matrix
[tool.hatch.envs.build-matrix]
description = "Build wheels for multiple Python versions"
detached = true
dependencies = [
    "hatchling",
    "hatch-cython>=0.5.0",
    "cython>=3.2.4,<4.0",
    "pillow>=9.0",
    "setuptools>=65.0",
    "build>=1.0",
]

# Define Python version matrix
[[tool.hatch.envs.build-matrix.matrix]]
python = ["3.11", "3.12", "3.13"]

[tool.hatch.envs.build-matrix.scripts]
# Build for specific Python version
wheel = "python -m build --wheel --no-isolation"
# Complete build including CEF setup (without tests)
complete = [
    "python tools/setup_cef.py",
    "python tools/build_libs_only.py 123.0 --fast",
    "python -m build --wheel --no-isolation",
]
# Complete build with tests (may fail if dependencies missing)
complete-with-tests = [
    "python tools/setup_cef.py",
    "python tools/build.py 123.0 --fast",
    "python -m build --wheel --no-isolation",
]

[tool.hatch.envs.test]
dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-forked>=1.6",
]

[tool.hatch.envs.test.scripts]
run = "pytest unittests/ -v --forked"
cov = "pytest unittests/ --cov=cefpython3 --cov-report=html --cov-report=term --forked"

# Configuration for 'hatch test' command
[tool.hatch.envs.hatch-test]
extra-dependencies = [
    "pillow>=9.0",
    "pytest-forked>=1.6",
]
# Override default test path from 'tests' to 'unittests'
# Use --forked to run each test in a separate process (required for CEF)
default-args = ["unittests/", "-v", "--forked"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12", "3.13"]

[tool.cython]
# Cython compiler directives
compiler_directives = { language_level = "3", embedsignature = true }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["unittests"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-ra -q"
filterwarnings = [
    # Ignore fork() deprecation warning from pytest-forked on Python 3.12+
    # This is a third-party library issue, not ours, and tests work fine
    "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks:DeprecationWarning",
]

# Hatch metadata
[tool.hatch.metadata]
allow-direct-references = true

# Build configuration for different Python versions
[tool.hatch.build.targets.wheel.hooks.cython]
dependencies = ["hatch-cython"]

[tool.hatch.build.targets.wheel.hooks.cython.options]
# Compile Cython extensions
compile_py = false
include_numpy = false
directives = { language_level = "3", embedsignature = true }

# Platform-specific settings
[tool.hatch.envs.build.env-vars]
CEF_VERSION = "123.0.7+g6a21509+chromium-123.0.6312.46"
CFLAGS = "-O3 -DNDEBUG"
CXXFLAGS = "-std=gnu++17 -O3 -DNDEBUG"
LDFLAGS = "-flto"
