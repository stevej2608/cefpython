[build-system]
requires = [
    "hatchling",
    "hatch-cython>=0.5.0",
    "cython>=3.0.12,<4.0",
]
build-backend = "hatchling.build"

[project]
name = "cefpython3"
version = "123.0"
description = "Python bindings for the Chromium Embedded Framework (CEF)"
readme = "DISTRIBUTION_README.md"
license = {file = "License"}
authors = [
    {name = "Czarek Tomczak", email = "czarek.tomczak@gmail.com"},
]
maintainers = [
    {name = "CEF Python Contributors"},
]
keywords = [
    "chromium",
    "cef",
    "browser",
    "embedded",
    "webkit",
    "gui",
    "web",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Cython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pillow>=9.0",
]
examples = [
    "pillow>=9.0",  # For screenshot example
]

[project.urls]
Homepage = "https://github.com/cztomczak/cefpython"
Documentation = "https://github.com/cztomczak/cefpython/blob/master/docs/README.md"
Repository = "https://github.com/cztomczak/cefpython"
Issues = "https://github.com/cztomczak/cefpython/issues"
Changelog = "https://github.com/cztomczak/cefpython/blob/master/CHANGELOG.md"

# Version is statically defined in [project] section above

# Enable custom build hook for platform-aware building
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["build/cefpython3_123.0_linux64/cefpython3"]
# Include all binary files
include = [
    "cefpython3/*.so",
    "cefpython3/subprocess",
    "cefpython3/libcef.so",
    "cefpython3/lib*.so*",
    "cefpython3/*.pak",
    "cefpython3/*.bin",
    "cefpython3/*.dat",
    "cefpython3/*.json",
    "cefpython3/locales/*.pak",
    "cefpython3/chrome-sandbox",
    "cefpython3/examples/**/*",
    "cefpython3/*.txt",
]

[tool.hatch.build.targets.wheel.force-include]
"build/cefpython3_123.0_linux64/cefpython3" = "cefpython3"
"build/cefpython3_123.0_linux64/examples" = "cefpython3/examples"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tools",
    "/examples",
    "/License",
    "/README.md",
    "/CHANGELOG.md",
    "/CEF123_LINUX_UPGRADE.md",
    "/DISTRIBUTION_README.md",
    "/pyproject.toml",
    "/hatch_build.py",
]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0",
    "pillow>=9.0",
]

[tool.hatch.envs.default.scripts]
# Build C++ libraries and Cython extension
build-cpp = "python tools/build.py 123.0 --fast"
# Run unit tests
test = "pytest unittests/ -v"
# Run examples
example-hello = "python -c 'from cefpython3.examples import hello_world; hello_world.main()'"
# Clean build artifacts
clean = "rm -rf build/build_cefpython build/temp.* dist/ *.egg-info && find . -type d -name __pycache__ -delete 2>/dev/null ; find . -type f -name '*.pyc' -delete ; find . -type f -name '*.pyo' -delete"

[tool.hatch.envs.build]
description = "Environment for building the complete package"
detached = true
dependencies = [
    "cython>=3.0.12,<4.0",
    "pillow>=9.0",
]

[tool.hatch.envs.build.scripts]
# Complete build process
all = [
    "setup-cef",
    "build-libs",
    "build-wheel",
    "checksums",
]
# Download and setup CEF binaries if not present (Linux/Mac)
setup-cef = """
# Detect platform
if [ "$(uname)" = "Linux" ]; then
    CEF_POSTFIX2="linux64"
elif [ "$(uname)" = "Darwin" ]; then
    CEF_POSTFIX2="macosx64"
else
    echo "Unsupported platform for this script. Use setup-cef-windows for Windows."
    exit 1
fi

CEF_DIR="cef123_"$CEF_VERSION"_"$CEF_POSTFIX2
CEF_URL="https://cef-builds.spotifycdn.com/cef_binary_"$CEF_VERSION"_"$CEF_POSTFIX2".tar.bz2"

if [ ! -d "build/$CEF_DIR" ]; then
    echo "CEF binaries not found. Downloading from $CEF_URL..."
    echo "This will download approximately 5.8GB. Please be patient..."
    mkdir -p build
    cd build

    curl -L -o cef_binary.tar.bz2 "$CEF_URL"
    echo "Extracting CEF binaries..."
    tar -xjf cef_binary.tar.bz2
    mv "cef_binary_"$CEF_VERSION"_"$CEF_POSTFIX2 "$CEF_DIR"

    cd "$CEF_DIR"
    echo "Building libcef_dll_wrapper..."
    mkdir -p build && cd build
    cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
    ninja libcef_dll_wrapper

    touch ../lib/README.txt ../lib/LICENSE.txt
    cd ..

    # Copy Release files to bin directory
    if [ ! -d "bin" ]; then
        mkdir -p bin
        cp -r Release/* bin/ 2>/dev/null || true
        cp -r Resources/* bin/ 2>/dev/null || true
    fi

    cd ../..
    rm cef_binary.tar.bz2
    echo "CEF binaries setup complete: $CEF_DIR"
else
    echo "CEF binaries already present: build/$CEF_DIR"
    # Ensure bin directory exists
    cd build/$CEF_DIR
    if [ ! -d "bin" ]; then
        mkdir -p bin
        cp -r Release/* bin/ 2>/dev/null || true
        cp -r Resources/* bin/ 2>/dev/null || true
    fi
    cd ../..
fi
"""
# Download and setup CEF binaries for Windows (PowerShell)
setup-cef-windows = """
$CEF_DIR = "cef123_" + $env:CEF_VERSION + "_windows64"
$CEF_URL = "https://cef-builds.spotifycdn.com/cef_binary_" + $env:CEF_VERSION + "_windows64.tar.bz2"

if (-not (Test-Path "build/$CEF_DIR")) {
    Write-Host "CEF binaries not found. Downloading from $CEF_URL..."
    Write-Host "This will download approximately 5.8GB. Please be patient..."
    New-Item -ItemType Directory -Force -Path build | Out-Null
    Set-Location build

    Invoke-WebRequest -Uri $CEF_URL -OutFile "cef_binary.tar.bz2"
    Write-Host "Extracting CEF binaries..."
    tar -xjf cef_binary.tar.bz2
    Rename-Item ("cef_binary_" + $env:CEF_VERSION + "_windows64") $CEF_DIR

    Set-Location $CEF_DIR
    Write-Host "Building libcef_dll_wrapper..."
    New-Item -ItemType Directory -Force -Path build | Out-Null
    Set-Location build
    cmake .. -G "Visual Studio 17 2022" -A x64
    cmake --build . --config Release --target libcef_dll_wrapper

    Set-Location ..
    New-Item -ItemType File -Force -Path lib/README.txt | Out-Null
    New-Item -ItemType File -Force -Path lib/LICENSE.txt | Out-Null

    # Copy Release files to bin directory
    if (-not (Test-Path "bin")) {
        New-Item -ItemType Directory -Force -Path bin | Out-Null
        Copy-Item -Recurse Release/* bin/ -ErrorAction SilentlyContinue
        Copy-Item -Recurse Resources/* bin/ -ErrorAction SilentlyContinue
    }

    Set-Location ../..
    Remove-Item cef_binary.tar.bz2
    Write-Host "CEF binaries setup complete: $CEF_DIR"
} else {
    Write-Host "CEF binaries already present: build/$CEF_DIR"
    # Ensure bin directory exists
    Set-Location build/$CEF_DIR
    if (-not (Test-Path "bin")) {
        New-Item -ItemType Directory -Force -Path bin | Out-Null
        Copy-Item -Recurse Release/* bin/ -ErrorAction SilentlyContinue
        Copy-Item -Recurse Resources/* bin/ -ErrorAction SilentlyContinue
    }
    Set-Location ../..
}
"""
# Build C++ libraries
build-libs = """
export CEF_CCFLAGS="-std=gnu++17 -DNDEBUG -Wall -Werror -Wno-deprecated-declarations -O3"
export PYTHON_INCLUDE="$(python -c 'import sysconfig; print(sysconfig.get_path("include"))')"
export CEF_BIN="build/cef123_123.0.7+g6a21509+chromium-123.0.6312.46_linux64/bin"
export CEF_LIB="build/cef123_123.0.7+g6a21509+chromium-123.0.6312.46_linux64/lib"
make -C src/client_handler
make -C src/subprocess -f Makefile-libcefpythonapp
make -C src/subprocess
make -C src/cpp_utils
"""
# Build Cython extension and create wheel
build-wheel = """
python tools/make_installer.py 123.0 && \
cd build/cefpython3_123.0_linux64 && \
echo "Stripping debug symbols from binaries to reduce package size..." && \
strip --strip-unneeded cefpython3/lib*.so* && \
strip --strip-unneeded cefpython3/subprocess && \
strip --strip-unneeded cefpython3/chrome-sandbox && \
echo "Stripped binaries. Package size should be significantly reduced." && \
ls -lh cefpython3/libcef.so && \
python setup.py bdist_wheel && \
cp dist/*.whl ../../dist/
"""
# Generate checksums
checksums = """
cd dist
sha256sum *.whl > SHA256SUMS 2>/dev/null || true
md5sum *.whl > MD5SUMS 2>/dev/null || true
"""

[tool.hatch.envs.test]
dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.envs.test.scripts]
run = "pytest unittests/ -v"
cov = "pytest unittests/ --cov=cefpython3 --cov-report=html --cov-report=term"

[tool.cython]
# Cython compiler directives
compiler_directives = { language_level = "3", embedsignature = true }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["unittests"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-ra -q"

# Hatch metadata
[tool.hatch.metadata]
allow-direct-references = true

# Build configuration for different Python versions
[tool.hatch.build.targets.wheel.hooks.cython]
dependencies = ["hatch-cython"]

[tool.hatch.build.targets.wheel.hooks.cython.options]
# Compile Cython extensions
compile_py = false
include_numpy = false
directives = { language_level = "3", embedsignature = true }

# Platform-specific settings
[tool.hatch.envs.build.env-vars]
CEF_VERSION = "123.0.7+g6a21509+chromium-123.0.6312.46"
CFLAGS = "-std=gnu++17 -O3 -DNDEBUG"
CXXFLAGS = "-std=gnu++17 -O3 -DNDEBUG"
LDFLAGS = "-flto"
